name: FaceID
version: "6.9.5"
slug: faceid
description: Face recognition for Frigate — trainable gallery, clustered unknown review, HA sensors
url: https://github.com/r11a/faceid
arch:
  - amd64
  - aarch64
startup: application
hassio_api: true
boot: auto
init: false
video: true
ingress: true
ingress_port: 8600
ingress_entry: ui-6.9.5
panel_icon: mdi:face-recognition
panel_title: FaceID
ports:
  8600/tcp: null
ports_description:
  8600/tcp: Web UI without ingress (optional)
backup_exclude:
  - model-cache
  - model-cache/**
map:
  - ssl:ro
  - share:rw
services:
  - mqtt:want
options:
  # Engine and stream
  backend: auto
  # Liveness
  liveness_enabled: true
  # Access1
  access_control_enabled: false
  access1_enabled: false
  # Backup and retention
  backup_enabled: false
  backup_hour: 3
  backup_keep: 7
  # Automations
  webhook_urls: []
  # Cameras (legacy)
  cameras: []
  discovery_cameras: []
schema:
  # Connection
  frigate_url: url?
  frigate_username: str?
  frigate_password: password?
  frigate_verify_tls: bool?
  frigate_topic_prefix: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  mqtt_prefix: str?
  # Engine and stream
  backend: list(auto|cpu|cuda|openvino|openvino_gpu|openvino_cpu)
  stream_gpu_decode: bool?
  stream_decode_width: int(0,4096)?
  stream_decode_threads: int(1,4)?
  stream_warm_seconds: int(0,3600)?
  frigate_box_association: bool?
  cpu_threads: int(0,16)?
  cpu_allow_spinning: bool?
  timing_diagnostics: bool?
  # Recognition
  match_threshold: float(0.2,0.9)?
  unknown_threshold: float(0.1,0.8)?
  match_margin: float(0.0,0.5)?
  min_confirmations: int(1,6)?
  min_face_quality: float(0.0,1.0)?
  recognition_session_seconds: int(30,3600)?
  guest_match_threshold: float(0.5,0.9)?
  guest_match_margin: float(0.08,0.5)?
  # Liveness
  liveness_enabled: bool
  liveness_threshold: float(0.0,1.0)?
  liveness_required_frames: int(2,8)?
  # Access1
  access_control_enabled: bool
  access1_enabled: bool
  access1_url: str?
  access1_token: password?
  access1_ca: str?
  access1_bind_address: str?
  access1_directory_token: password?
  access1_tls_cert: str?
  access1_tls_key: str?
  # Backup and retention
  backup_enabled: bool
  backup_hour: int(0,23)
  backup_keep: int(1,90)
  backup_dir: str?
  audit_retention_days: int(0,3650)?
  known_evidence_days: int(1,3650)?
  unknown_evidence_days: int(1,3650)?
  known_evidence_max: int(0,5000)?
  unknown_evidence_max: int(0,5000)?
  media_max_clip_mb: int(20,1000)?
  media_cache_mb: int(100,10000)?
  media_retention_hours: int(1,168)?
  # Gallery and review
  max_faces_per_person: int(5,100)?
  trimmed_keep: int(0,100)?
  dedupe_threshold: float(0.50,0.95)?
  cluster_eps: float(0.3,0.8)?
  suggest_threshold: float(0.1,0.9)?
  ignore_margin: float(0.0,0.5)?
  hires_enroll: bool?
  review_queue_max_total: int(25,1000)?
  review_queue_max_per_cluster: int(3,50)?
  review_queue_retention_days: int(1,90)?
  review_queue_dedupe_days: int(1,30)?
  # Clips
  clip_analysis: bool?
  clip_max_frames: int(4,120)?
  clip_max_samples: int(2,30)?
  clip_retry_attempts: int(1,10)?
  clip_retry_seconds: int(1,120)?
  video_decode: list(auto|software|vaapi|cuda)?
  poll_interval: int(0,3600)?
  # Site and tracking
  presence_window: int(10,3600)?
  visit_gap_minutes: int(2,120)?
  calibration_target_far: float(0.0,0.5)?
  scenario_window: int(5,900)?
  camera_graph_json: str?
  reid_enabled: bool?
  reid_ttl: int(10,1800)?
  reid_threshold: float(0.5,1.0)?
  body_enabled: bool?
  body_threshold: float(0.5,0.99)?
  body_confirmations: int(2,10)?
  body_consensus_window: int(30,1800)?
  vision_advisor_enabled: bool?
  # Automations
  automation_cooldown: int(0,3600)?
  webhook_urls:
    - url
  set_sub_label: bool?
  ai_enabled: bool?
  ai_url: url?
  ai_vision_model: str?
  ai_embedding_model: str?
  # Cameras (legacy)
  cameras:
    - str
  discovery_cameras:
    - str

# Access1 pairing verifies the current HA administrator.
homeassistant_api: true
