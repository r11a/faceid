<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceID</title>
<style>
:root{
  --bg:oklch(18% .012 80);--panel:oklch(22% .012 80);--line:oklch(32% .01 80);
  --fg:oklch(88% .01 90);--dim:oklch(62% .01 90);--acc:oklch(85% .25 130);
  --warn:oklch(75% .18 60);--bad:oklch(65% .2 25);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
header{display:flex;align-items:baseline;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font:700 15px var(--mono);color:var(--acc);letter-spacing:.08em}
header .stat{font:12px var(--mono);color:var(--dim)}
nav{display:flex;gap:0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);
  font:13px var(--mono);padding:8px 18px;cursor:pointer}
nav button.on{color:var(--acc);background:var(--panel)}
main{padding:16px;max-width:1200px}
h2{font:600 12px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:saturate(.9)}
.tile .score{position:absolute;bottom:0;left:0;right:0;font:11px var(--mono);
  background:color-mix(in oklab,var(--bg) 80%,transparent);padding:1px 4px;color:var(--acc)}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tile button.x{position:absolute;top:0;right:0;background:var(--bg);border:0;color:var(--bad);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile button.u{position:absolute;top:0;left:0;background:var(--bg);border:0;color:var(--warn);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile:hover button.x,.tile:hover button.u{display:block}
.cluster{border:1px solid var(--line);padding:10px;margin-bottom:14px}
.cluster.sugg{border-color:var(--acc)}
.cluster.sugg .head b{color:var(--acc)}
.tile .x{position:absolute;top:0;right:0;background:var(--bg);border:0;color:var(--bad);font:12px var(--mono);padding:2px 6px;cursor:pointer}
.cluster .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cluster .head b{font:600 13px var(--mono);color:var(--fg)}
.cluster .guess{font:12px var(--mono);color:var(--warn)}
.person{border:1px solid var(--line);padding:10px;margin-bottom:14px}
.person .head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.person .head b{font:600 14px var(--sans)}
.person .head .n{font:12px var(--mono);color:var(--dim)}
.person .head button.fav{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.person .head button.fav.on{color:var(--acc)}
.act,button.act{background:var(--acc);border:0;color:oklch(20% .02 130);font:600 12px var(--mono);
  padding:5px 12px;cursor:pointer;display:inline-block;line-height:1.35;text-decoration:none;vertical-align:middle}
.ghost,button.ghost{background:none;border:1px solid var(--line);color:var(--dim);font:12px var(--mono);
  padding:4px 10px;cursor:pointer;display:inline-block;line-height:1.35;text-decoration:none;vertical-align:middle}
.ghost:hover,button.ghost:hover{color:var(--fg)}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
  font:13px var(--mono);padding:5px 8px}
table{border-collapse:collapse;width:100%;font:13px var(--mono)}
td,th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
td.p{color:var(--acc)} td.u{color:var(--warn)}
.empty{color:var(--dim);font:13px var(--mono);padding:20px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
#toast{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--acc);
  color:var(--fg);font:12px var(--mono);padding:8px 14px;display:none}
.tile button.z{position:absolute;bottom:18px;right:0;background:var(--bg);border:0;color:var(--acc);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile:hover button.z{display:block}
.trimgrid .tile img{filter:grayscale(1) brightness(.55);transition:filter .15s}
.trimgrid .tile:hover img{filter:none}
.tile.simhi{outline:3px solid var(--acc);outline-offset:-3px}
.tile.simlow{outline:2px solid var(--dim);outline-offset:-2px}
.tile .simscore{position:absolute;top:0;left:0;background:var(--bg);color:var(--fg);font:10px var(--mono);padding:1px 4px;z-index:2}
.tile.simhi img{filter:none;opacity:1}
.trimlabel{display:inline-block;font:600 10px var(--mono);letter-spacing:.1em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 6px;margin-bottom:4px}
#lightbox{position:fixed;inset:0;background:color-mix(in oklab,var(--bg) 88%,transparent);
  display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out;flex-direction:column;gap:8px}
#lightbox img{max-width:94vw;max-height:88vh;border:1px solid var(--acc)}
#lightbox .cap{font:12px var(--mono);color:var(--dim)}
  .logline{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;padding:1px 0}
  .logline .t{color:var(--dim)}
  .lv-WARNING{color:#e0a030}
  .lv-ERROR,.lv-CRITICAL{color:#e05555}
  .logwrap{background:var(--panel);border:1px solid var(--line);padding:10px;
           max-height:70vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>FACEID</h1>
  <span class="stat" id="health">—</span>
</header>
<nav>
  <button data-t="unknowns" class="on" title="review queue: unrecognized faces, grouped by person">UNKNOWN</button>
  <button data-t="persons" title="your gallery: enrolled people and their reference faces">PERSONS</button>
  <button data-t="ignored" title="people you don't track: never notified, matched or resurfaced">IGNORED</button>
  <button data-t="activity" title="final decisions, cross-camera scenarios and event labels">ACTIVITY</button>
  <button data-t="calibration" title="measure false accepts/rejects and recommend safe thresholds">CALIBRATION</button>
  <button data-t="settings" title="matching thresholds, backup and restore">SETTINGS</button>
  <button data-t="log" title="recent service log — what FaceID is doing, and why nothing was recognised">LOG</button>
</nav>
<main id="main"></main>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg" src=""><span class="cap" id="lbcap"></span></div>

<script>
const $=s=>document.querySelector(s), main=$('#main');
let tab='unknowns', persons={}, selected=new Set(), suggestThr=0.40;

async function j(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTs(ts){return new Date(ts*1000).toLocaleString(undefined,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
// Wann das Ereignis passierte, nicht wann wir es verarbeitet haben — beim Verlaufs-Scan
// liegen die Wochen auseinander.
function fmtWhen(u){return fmtTs(u.event_ts||u.ts)}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;selected.clear();
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  render()});

async function health(){try{const h=await j('api/health');
  if(typeof h.suggest_threshold==='number')suggestThr=h.suggest_threshold;
  $('#health').textContent=`${h.persons} persons · queue ${h.queue} · events ${h.open_events}`}catch(e){$('#health').textContent='offline'}}

function personOptions(sel){
  const es=Object.entries(persons).sort((a,b)=>a[1].name.localeCompare(b[1].name,undefined,{sensitivity:'base'}));
  const opt=([s,p])=>`<option value="${s}"${s===sel?' selected':''}>${esc(p.name)}</option>`;
  const favs=es.filter(([,p])=>p.favorite), rest=es.filter(([,p])=>!p.favorite);
  let out='';
  if(favs.length)out+=`<optgroup label="★ Favorites">${favs.map(opt).join('')}</optgroup>`;
  if(rest.length)out+=(favs.length?`<optgroup label="Others">${rest.map(opt).join('')}</optgroup>`:rest.map(opt).join(''));
  return out;
}

async function render(){
  const t=tab;
  persons=await j('api/persons');
  if(t!==tab)return;
  if(tab==='unknowns')return renderUnknowns();
  if(tab==='persons')return renderPersons();
  if(tab==='ignored')return renderIgnored();
  if(tab==='activity')return renderActivity();
  if(tab==='calibration')return renderCalibration();
  if(tab==='settings')return renderSettings();
  if(tab==='log')return renderLog();
  return renderPersons();
}

function backfillRow(bf){
  const status = bf.running
    ? `scanning history… ${bf.processed}/${bf.total||'?'} events`
    : bf.result
      ? bf.result.error
        ? `scan failed: ${esc(bf.result.error)}`
        : `last scan: ${bf.result.faces} new faces, ${bf.result.known} already known, ${bf.result.no_face} without a face`
      : 'pulls faces from past camera events into the review queue';
  return `<div class="row">
    <select id="bfdays" title="how far back to scan" ${bf.running?'disabled':''}>
      <option value="7">last 7 days</option>
      <option value="14" selected>last 14 days</option>
      <option value="28">last 28 days</option>
    </select>
    <button class="act" title="pull faces from past Frigate events into this queue; known people get tagged retroactively" onclick="startBackfill()" ${bf.running?'disabled':''}>
      ${bf.running?'SCANNING…':'SCAN CAMERA HISTORY'}</button>
    <span class="stat">${status}</span>
  </div>`;
}
async function startBackfill(){
  try{
    await j('api/backfill',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({days:+$('#bfdays').value})});
    toast('History scan started');
  }catch(e){toast('Scan already running')}
  render();
}
async function renderUnknowns(){
  const [clusters,bf]=await Promise.all([j('api/unknowns'),j('api/backfill')]);
  if(tab!=='unknowns')return;
  if(bf.running&&tab==='unknowns')setTimeout(()=>{if(tab==='unknowns')render()},4000);
  if(!clusters.length){
    main.innerHTML=backfillRow(bf)+'<div class="empty">No unknown faces in the queue.</div>';return}
  const excluded=window._excludedIds||(window._excludedIds=new Set());
  const n2s={}; Object.entries(persons).forEach(([sl,p])=>{n2s[p.name]=sl;});
  const SUGGEST=suggestThr;
  // Vorschlags-Gruppen (nach vermuteter Person) + Rest-Cluster
  const byName={};
  const rest=[];
  clusters.forEach(c=>{
    const keep=[];
    c.forEach(it=>{
      if(it.guess&&it.guess_score>=SUGGEST&&n2s[it.guess]&&!excluded.has(it.id))
        (byName[it.guess]=byName[it.guess]||[]).push(it);
      else keep.push(it);
    });
    if(keep.length)rest.push(keep);
  });
  const sugg=Object.keys(byName).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}))
    .map(name=>({name,slug:n2s[name],items:byName[name]}));
  window._sugg=sugg; window._clusters=rest; window._n2s=n2s;

  let html=backfillRow(bf)+`<div class="row">
    <button class="act" title="assign every face whose best gallery match clears the recognition threshold" onclick="autoAssign()">APPLY SUGGESTIONS ≥50%</button>
    <span class="stat">assigns every face whose best gallery match clears the recognition threshold</span>
  </div>`;

  // --- Vorschlags-Gruppen ---
  html+=sugg.map((g,gi)=>{
    const avg=Math.round(g.items.reduce((a,it)=>a+(it.guess_score||0),0)/g.items.length*100);
    return `
    <div class="cluster sugg" data-sg="${gi}">
      <div class="head">
        <b>★ Looks like ${esc(g.name)}</b>
        <span class="stat">${g.items.length} face(s) · avg ${avg}%</span>
        <span style="flex:1"></span>
        <select id="ssel${gi}" title="assign to a different person instead">${personOptions(g.slug)}</select>
        <button class="act" title="assign all faces in this group" onclick="assignSuggestion(${gi})">ASSIGN ALL</button>
        <button class="ghost" style="color:var(--warn);border-color:var(--warn)" title="never notify, match or resurface these faces" onclick="ignoreSuggestion(${gi})">ignore</button>
      </div>
      <div class="grid">${g.items.map(u=>`
        <div class="tile">
          <img src="media/unknowns/${u.id}.jpg" loading="lazy">
          <span class="score">${(u.guess_score*100|0)}% · ${fmtWhen(u)}</span>
          ${u.full_url?`<button class="z" title="full snapshot" onclick="showFull('${u.full_url}','${esc(u.camera||'')} · ${fmtWhen(u)}','media/unknowns/${u.id}.jpg')">⛶</button>`:''}
          <button class="x" title="not ${esc(g.name)} — pull this face out" onclick="rejectSuggestion('${u.id}')">×</button>
        </div>`).join('')}
      </div>
    </div>`;}).join('');

  // --- Rest-Cluster (unerkannt), Dropdown auf Guess vorgewaehlt ---
  html+=rest.map((c,i)=>{
    const gslug=(c[0].guess&&n2s[c[0].guess])?n2s[c[0].guess]:'';
    return `
    <div class="cluster" data-i="${i}">
      <div class="head">
        <b>CLUSTER ${String(i+1).padStart(2,'0')}</b>
        <span class="stat">${c.length} capture${c.length>1?'s':''} · ${esc(c[0].camera||'')}</span>
        ${c[0].guess?`<span class="guess">looks like ${esc(c[0].guess)} (${(c[0].guess_score*100|0)}%)</span>`:''}
        <span style="flex:1"></span>
        <select id="sel${i}" title="assign to an existing person"><option value="">— pick person —</option>${personOptions(gslug)}</select>
        <input id="new${i}" placeholder="…or new name" size="14" title="or create a new person with this name">
        <button class="act" title="assign selected tiles (or the whole cluster) to the chosen person" onclick="assignCluster(${i})">ASSIGN</button>
        <button class="ghost" style="color:var(--warn);border-color:var(--warn)" onclick="ignoreCluster(${i})" title="never notify, match or resurface these faces">ignore</button>
        <button class="ghost" title="delete garbage crops permanently — does NOT stop future matching; use ignore for people" onclick="discardCluster(${i})">discard</button>
      </div>
      <div class="grid">${c.map(u=>`
        <div class="tile" data-id="${u.id}" title="click to select — actions then apply to the selection only" onclick="this.classList.toggle('sel')">
          <img src="media/unknowns/${u.id}.jpg" loading="lazy">
          <span class="score">${fmtWhen(u)}</span>
          ${u.full_url?`<button class="z" title="full snapshot" onclick="event.stopPropagation();showFull('${u.full_url}','${esc(u.camera||'')} · ${fmtWhen(u)}','media/unknowns/${u.id}.jpg')">⛶</button>`:''}
        </div>`).join('')}
      </div>
    </div>`;}).join('');
  main.innerHTML=html;
}
async function assignSuggestion(gi){
  const g=window._sugg[gi]; if(!g)return;
  const slug=$(`#ssel${gi}`).value||g.slug;
  const ids=g.items.map(it=>it.id).filter(id=>!window._excludedIds.has(id));
  if(!ids.length)return toast('Nothing to assign');
  const r=await j('api/unknowns/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,person:slug})});
  toast(`${r.assigned} face(s) assigned`);render();
}
async function ignoreSuggestion(gi){
  const g=window._sugg[gi]; if(!g)return;
  const ids=g.items.map(it=>it.id).filter(id=>!window._excludedIds.has(id));
  const r=await j('api/unknowns/ignore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,person:'-'})});
  toast(`${r.ignored} ignored`);render();
}
function hiliteSimilar(slug,items){
  const card=document.getElementById('p-'+slug); if(!card)return;
  const map=new Map((items||[]).map(x=>[x.file,x]));
  card.querySelectorAll('.grid:not(.trimgrid) .tile[data-file]').forEach(t=>{
    const it=map.get(t.dataset.file);
    t.classList.toggle('simhi',!!it&&it.partner);
    t.classList.toggle('simlow',!!it&&!it.partner);
    let b=t.querySelector('.simscore');
    if(it){
      if(!b){b=document.createElement('span');b.className='simscore';t.appendChild(b);}
      b.textContent=Math.round(it.score*100)+'%';
    }else if(b){b.remove();}
  });
}
function rejectSuggestion(id){(window._excludedIds||(window._excludedIds=new Set())).add(id);render();}
async function renderIgnored(){
  const clusters=await j('api/ignored');
  if(tab!=='ignored')return;
  if(!clusters.length){main.innerHTML='<div class="empty">Nobody on the ignore list. Use "ignore" on an unknown cluster or "ignore person" on a person card — ignored people are never notified, matched or resurfaced.</div>';return}
  const total=clusters.reduce((a,c)=>a+c.length,0);
  main.innerHTML=`<div class="row"><span class="stat">${total} anchor face(s) in ${clusters.length} group(s) — never notified, never matched to a known person, never resurfaced.</span></div>`
    +clusters.map((c,i)=>`
    <div class="cluster" data-ig="${i}">
      <div class="head">
        <b>IGNORED ${String(i+1).padStart(2,'0')}</b>
        <span class="stat">${c.length} anchor${c.length>1?'s':''}${c.filter(x=>x.auto).length?` · ${c.filter(x=>x.auto).length} auto-learned`:''}${c[0].from_person?` · was "${esc(c[0].from_person)}"`:''}</span>
        <span style="flex:1"></span>
        <select id="igmv${i}" title="declare this group (or selected tiles) the same person as another group">
          <option value="">— merge into —</option>
          ${clusters.map((o,k)=>k===i?'':`<option value="${o[0].group}">group ${String(k+1).padStart(2,'0')}${o[0].from_person?` (${esc(o[0].from_person)})`:''}</option>`).join('')}
        </select>
        <select id="igas${i}" title="wrongly ignored? move faces to a real person as reference images"><option value="">— assign to person —</option>${personOptions()}</select>
        <input id="igan${i}" placeholder="…or new name" size="12" title="or release this group as a brand-new person">
        <button class="act" title="apply the chosen merge or person assignment to selected tiles (or the whole group)" onclick="applyIgnored(${i})">APPLY</button>
        <button class="ghost" onclick="restoreIgnoredMany(${i})" title="move back to the review queue">↩</button>
        <button class="ghost" title="delete selected/all anchors permanently — this person may resurface as unknown" onclick="deleteIgnoredMany(${i})">delete</button>
      </div>
      <div class="grid">${c.map(it=>`
        <div class="tile" data-id="${it.id}" title="click to select — group actions then apply to the selection only" onclick="this.classList.toggle('sel')">
          <img src="media/ignored/${it.id}.jpg" loading="lazy">
          <span class="score">${it.auto?'auto · ':''}${fmtTs(it.ts)}</span>
          <button class="u" title="back to review queue" onclick="event.stopPropagation();restoreIgnored('${it.id}')">↩</button>
          <button class="x" title="delete permanently" onclick="event.stopPropagation();deleteIgnored('${it.id}')">×</button>
        </div>`).join('')}
      </div>
    </div>`).join('');
  window._ignClusters=clusters;
}
function ignSelection(i){
  const box=document.querySelector(`.cluster[data-ig="${i}"]`);
  const sel=[...box.querySelectorAll('.tile.sel')].map(t=>t.dataset.id);
  return sel.length?sel:window._ignClusters[i].map(it=>it.id);
}
async function applyIgnored(i){
  const grp=$(`#igmv${i}`).value, person=$(`#igan${i}`).value.trim()||$(`#igas${i}`).value, ids=ignSelection(i);
  if(grp&&person)return toast('Pick either a group or a person, not both');
  if(!grp&&!person)return toast('Pick a target group or person first');
  if(grp){
    const r=await j('api/ignored/move',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids,group:grp})});
    toast(`${r.moved} anchor(s) merged into the selected group`);
  }else{
    const r=await j('api/ignored/assign',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids,person})});
    toast(`${r.assigned} face(s) assigned to person`);
  }
  render();
}
async function restoreIgnoredMany(i){
  const ids=ignSelection(i);
  await j('api/ignored/restore',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids,person:'-'})});
  toast(`${ids.length} face(s) moved back to the review queue`);render();
}
async function deleteIgnoredMany(i){
  const ids=ignSelection(i);
  if(!confirm(`Permanently delete ${ids.length} ignore anchor(s)? This person may resurface as unknown.`))return;
  await j('api/ignored/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids,person:'-'})});
  render();
}
async function ignoreCluster(i){
  const box=document.querySelector(`.cluster[data-i="${i}"]`);
  const sel=[...box.querySelectorAll('.tile.sel')].map(t=>t.dataset.id);
  const ids=sel.length?sel:window._clusters[i].map(u=>u.id);
  const r=await j('api/unknowns/ignore',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids,person:'-'})});
  toast(`${r.ignored} face(s) ignored — they will not be matched or shown again`);render();
}
async function restoreIgnored(id){
  await j('api/ignored/restore',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids:[id],person:'-'})});
  toast('Face moved back to the review queue');render();
}
async function deleteIgnored(id){
  await j('api/ignored/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids:[id],person:'-'})});
  render();
}
async function assignCluster(i){
  const person=$(`#new${i}`).value.trim()||$(`#sel${i}`).value;
  if(!person)return toast('Pick a person or enter a name');
  const box=document.querySelector(`.cluster[data-i="${i}"]`);
  const sel=[...box.querySelectorAll('.tile.sel')].map(t=>t.dataset.id);

let _dedupeTimer=null;
function dedupePreview(){
  clearTimeout(_dedupeTimer);
  _dedupeTimer=setTimeout(async()=>{
    const el=document.getElementById('set-dedupe_threshold'); if(!el)return;
    const thr=+el.value;
    try{
      const r=await j('api/deduplicate',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({threshold:thr,dry_run:true})});
      const p=document.getElementById('dedupePrev');
      if(p){const parts=[];
        if(r.same_image)parts.push(`${r.same_image} duplicate image(s)`);
        if(r.similar_face)parts.push(`${r.similar_face} near-identical face(s) at sensitivity ${thr.toFixed(2)}`);
        p.textContent=parts.length?`would set aside: ${parts.join(' + ')} (restorable).`:`nothing to remove at sensitivity ${thr.toFixed(2)}.`;}
    }catch(e){}
  },250);
}
async function runDedupe(){
  const thr=+document.getElementById('set-dedupe_threshold').value;

  toast(r.moved?`${r.moved} set aside (${r.same_image} duplicate image, ${r.similar_face} similar face)`:'No duplicates found');persons=await j('api/persons');
}

  if(!merge&&!confirm('Replace ALL current persons and ignore anchors with this backup? This cannot be undone.')){inp.value='';return;}
  const fd=new FormData(); fd.append('file',f);
  toast('Restoring...');
  try{
    const r=await j('api/restore?merge='+(merge?'true':'false'),{method:'POST',body:fd});
    toast('Restored '+r.restored_files+' file(s) ('+r.mode+') - '+r.persons+' persons');
  }catch(e){toast('Restore failed: '+String(e.message).slice(0,80));}

}

        <div class="grid trimgrid" style="margin-top:6px">${p.trimmed.map(t=>`
          <div class="tile" onmouseenter="hiliteSimilar('${slug}',${JSON.stringify(t.similar||[]).replace(/"/g,'&quot;')})" onmouseleave="hiliteSimilar('${slug}',[])"><img src="media/persons/${slug}/_trimmed/${t.file}" loading="lazy" title="${t.kind==='same_image'?'Same image as the photo highlighted above.':t.kind==='near_dup'?'Near-duplicate of the photo highlighted above.':'Set aside because of the photo limit — highlighted above are its closest matches with their similarity. They are the same person from other angles, not duplicates.'} · ${fmtTs(t.ts)}">
            <button class="u" title="restore this photo" onclick="restoreTrimmed('${slug}','${t.file}')">↩</button>
            <button class="x" title="delete permanently" onclick="deleteTrimmed('${slug}','${t.file}')">×</button></div>`).join('')}
        </div>
      </div>`:''}
    </div>`;
}
async function renderPersons(){
  if(tab!=='persons')return;
  const entries=Object.entries(persons)
    .sort((a,b)=>a[1].name.localeCompare(b[1].name,undefined,{sensitivity:'base'}));
  const favs=entries.filter(([,p])=>p.favorite);
  const rest=entries.filter(([,p])=>!p.favorite);
  let body='';
  if(favs.length) body+=`<h2>★ Favorites (${favs.length})</h2>`+favs.map(([s,p])=>personCard(s,p)).join('');
  if(rest.length) body+=`<h2>${favs.length?'Others':'Persons'} (${rest.length})</h2>`+rest.map(([s,p])=>personCard(s,p)).join('');
  if(!entries.length) body='<div class="empty">No persons yet.</div>';
  const jump=entries.length>3?`
      <select id="pjump" title="jump to a person" onchange="if(this.value){document.getElementById('p-'+this.value).scrollIntoView({behavior:'smooth',block:'start'});this.value='';}">
        <option value="">Jump to…</option>${personOptions('')}
      </select>`:'';
  main.innerHTML=`
    <div class="row">
      <input id="pname" placeholder="New person…" size="18" title="create an empty person, then upload photos or assign faces from the unknown queue">
      <button class="act" onclick="createPerson()">CREATE</button>
      <span style="flex:1"></span>${jump}
    </div>`+body;
}
async function clearTrimmed(slug,name){
  if(!confirm('Delete all set-aside photos of "'+name+'"? Your active reference photos stay.'))return;
  const r=await j('api/persons/'+slug+'/trimmed/clear',{method:'POST'});
  toast(r.cleared+' set-aside photo(s) deleted');persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function restoreTrimmed(slug,file){
  await j(`api/persons/${slug}/trimmed/${file}/restore`,{method:'POST'});
  toast('Photo restored');persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function deleteTrimmed(slug,file){
  await j(`api/persons/${slug}/trimmed/${file}`,{method:'DELETE'});
  persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function toggleFav(slug,fav){
  await j(`api/persons/${slug}/favorite`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({favorite:!!fav})});
  persons=await j('api/persons');
  if(tab==='persons')renderPersons();
}
async function createPerson(){const n=$('#pname').value.trim();if(!n)return;
  await j('api/persons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  toast(`Created "${n}"`);render()}
async function upload(slug,inp){
  const fd=new FormData();[...inp.files].forEach(f=>fd.append('files',f));
  toast(`Processing ${inp.files.length} photo(s)…`);
  const r=await j(`api/persons/${slug}/photos`,{method:'POST',body:fd});
  toast(`${r.added} enrolled${r.skipped.length?`, ${r.skipped.length} skipped`:''}`);render()}
async function delFace(slug,f){await j(`api/persons/${slug}/faces/${f}`,{method:'DELETE'});render()}
async function unassignFace(slug,f){await j(`api/persons/${slug}/faces/${f}/unassign`,{method:'POST'});
  toast('Face moved back to the unknown queue');render()}
async function ignorePerson(slug,name){
  if(!confirm(`Stop tracking "${name}"? All their faces become ignore anchors — they will never be notified, matched or shown again. (Reversible via the Ignored section.)`))return;
  const r=await j(`api/persons/${slug}/ignore`,{method:'POST'});
  toast(`"${name}" ignored (${r.ignored_faces} anchor faces)`);render();
}
async function delPerson(slug,name){if(!confirm(`Delete "${name}" and all their faces?`))return;
  await j(`api/persons/${slug}`,{method:'DELETE'});render()}


health();setInterval(health,10000);render();
</script>
