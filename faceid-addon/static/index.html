<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceID</title>
<style>
:root{
  --bg:#111213;--panel:#1b1d1f;--panel2:#25282b;--line:#3a3d40;
  --fg:#f1f1ef;--dim:#aaa9a5;--acc:#88d498;--accent2:#b8babd;
  --warn:#e7b96b;--bad:#ef7c87;--good:#88d498;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 15% 0,#2b2d30 0,transparent 38%),var(--bg);
  color:var(--fg);font:14px/1.55 var(--sans);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:17px clamp(16px,3vw,36px);
  border-bottom:1px solid var(--line);background:#141516e8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
header h1{font:800 18px var(--sans);color:var(--fg);letter-spacing:.02em}
header h1 span{color:var(--acc)}
header .stat{font:12px var(--sans);color:var(--dim);padding:6px 10px;background:var(--panel);border-radius:99px}
.header-spacer{flex:1}
.version-badge{color:var(--acc)!important;font-weight:800!important;border:1px solid color-mix(in oklab,var(--acc) 45%,var(--line))}
.clock{font-variant-numeric:tabular-nums;color:var(--fg)!important}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:8px clamp(12px,3vw,32px);
  overflow-x:auto;background:#141516d9;position:sticky;top:116px;z-index:4;backdrop-filter:blur(16px);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-radius:9px;color:var(--dim);
  font:600 13px var(--sans);padding:9px 14px;cursor:pointer;white-space:nowrap}
nav button.on{color:#07130d;background:var(--acc)}
nav button[data-workspace="operate"].on{background:#92d3a0;color:#102016;box-shadow:0 5px 20px #92d3a033}
nav button[data-workspace="investigate"].on{background:#e5b96f;color:#271b08;box-shadow:0 5px 20px #e5b96f33}
nav button[data-workspace="system"].on{background:#b6a5c9;color:#21182a;box-shadow:0 5px 20px #b6a5c933}
.workspace-switch{display:flex;justify-content:center;gap:5px;padding:7px 14px;background:#101112;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:5}
.workspace-switch button{border:1px solid transparent;background:transparent;color:var(--dim);padding:7px 14px;font-weight:750}
.workspace-switch button.on{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.workspace-switch button[data-workspace="operate"].on{border-color:#5f8f69;color:#aee6b8;background:#1d2921}
.workspace-switch button[data-workspace="investigate"].on{border-color:#9e7940;color:#f2cb8c;background:#2c251a}
.workspace-switch button[data-workspace="system"].on{border-color:#78668a;color:#d4c3e5;background:#26202d}
body[data-workspace="investigate"]{--acc:#e5b96f;--good:#95cf9f}
body[data-workspace="system"]{--acc:#b6a5c9;--good:#95cf9f}
nav button.workspace-hidden{display:none}
main{padding:clamp(18px,3vw,36px);max-width:1500px;margin:auto}
h2{font:600 12px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:saturate(.9)}
.tile .score{position:absolute;bottom:0;left:0;right:0;font:11px var(--mono);
  background:color-mix(in oklab,var(--bg) 80%,transparent);padding:1px 4px;color:var(--acc)}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tile button.x{position:absolute;top:0;right:0;background:var(--bg);border:0;color:var(--bad);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile button.u{position:absolute;top:0;left:0;background:var(--bg);border:0;color:var(--warn);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile:hover button.x,.tile:hover button.u{display:block}
.cluster{border:1px solid var(--line);padding:10px;margin-bottom:14px}
.cluster.sugg{border-color:var(--acc)}
.cluster.sugg .head b{color:var(--acc)}
.tile .x{position:absolute;top:0;right:0;background:var(--bg);border:0;color:var(--bad);font:12px var(--mono);padding:2px 6px;cursor:pointer}
.cluster .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cluster .head b{font:600 13px var(--mono);color:var(--fg)}
.cluster .guess{font:12px var(--mono);color:var(--warn)}
.person{border:1px solid var(--line);padding:10px;margin-bottom:14px}
.person .head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.person .head b{font:600 14px var(--sans)}
.person .head .n{font:12px var(--mono);color:var(--dim)}
.person .head button.fav{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.person .head button.fav.on{color:var(--acc)}
.act,button.act{background:var(--acc);border:0;color:oklch(20% .02 130);font:600 12px var(--mono);
  padding:5px 12px;cursor:pointer;display:inline-block;line-height:1.35;text-decoration:none;vertical-align:middle}
.ghost,button.ghost{background:none;border:1px solid var(--line);color:var(--dim);font:12px var(--mono);
  padding:4px 10px;cursor:pointer;display:inline-block;line-height:1.35;text-decoration:none;vertical-align:middle}
.ghost:hover,button.ghost:hover{color:var(--fg)}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
  font:13px var(--mono);padding:5px 8px}
table{border-collapse:collapse;width:100%;font:13px var(--mono)}
td,th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
td.p{color:var(--acc)} td.u{color:var(--warn)}
.empty{color:var(--dim);font:13px var(--mono);padding:20px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
#toast{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--acc);
  color:var(--fg);font:12px var(--mono);padding:8px 14px;display:none}
.tile button.z{position:absolute;bottom:18px;right:0;background:var(--bg);border:0;color:var(--acc);
  font:12px var(--mono);padding:2px 6px;cursor:pointer;display:none}
.tile:hover button.z{display:block}
.trimgrid .tile img{filter:grayscale(1) brightness(.55);transition:filter .15s}
.trimgrid .tile:hover img{filter:none}
.tile.simhi{outline:3px solid var(--acc);outline-offset:-3px}
.tile.simlow{outline:2px solid var(--dim);outline-offset:-2px}
.tile .simscore{position:absolute;top:0;left:0;background:var(--bg);color:var(--fg);font:10px var(--mono);padding:1px 4px;z-index:2}
.tile.simhi img{filter:none;opacity:1}
.trimlabel{display:inline-block;font:600 10px var(--mono);letter-spacing:.1em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 6px;margin-bottom:4px}
#lightbox{position:fixed;inset:0;background:color-mix(in oklab,var(--bg) 88%,transparent);
  display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out;flex-direction:column;gap:8px}
#lightbox img{max-width:94vw;max-height:88vh;border:1px solid var(--acc)}
#lightbox .cap{font:12px var(--mono);color:var(--dim)}
  .logline{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;padding:1px 0}
  .logline .t{color:var(--dim)}
  .lv-WARNING{color:#e0a030}
  .lv-ERROR,.lv-CRITICAL{color:#e05555}
  .logwrap{background:var(--panel);border:1px solid var(--line);padding:10px;
           max-height:70vh;overflow:auto}
button:disabled{opacity:.38!important;cursor:not-allowed!important}
button{border-radius:10px;transition:transform .14s ease,background .14s ease,border-color .14s ease,opacity .14s ease}
button:not(:disabled):hover{transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in oklab,var(--acc) 55%,transparent);outline-offset:2px}
.act,.ghost{min-height:38px;border-radius:10px!important;font-family:var(--sans)!important;font-size:13px!important;font-weight:750!important;padding:8px 14px!important}
.act[aria-busy="true"],.ghost[aria-busy="true"]{cursor:wait!important;position:relative}
#toast{z-index:50;direction:rtl;border-radius:12px;box-shadow:0 18px 60px #0009;font-family:var(--sans);font-size:14px;padding:12px 18px;max-width:min(420px,calc(100vw - 32px))}
#toast.error{border-color:var(--bad);color:#ffd9dd}
.camera-layout{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:18px;align-items:start}
.camera-list{display:grid;gap:9px;position:sticky;top:130px}
.camera-choice{width:100%;text-align:right;padding:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:flex;justify-content:space-between;align-items:center}

.studio-panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#25272a,#18191b);overflow:hidden}

.sample-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}.sample-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#17191b}.sample-card img{width:100%;height:88px;object-fit:cover}.sample-card div{padding:7px;font-size:11px}.sample-card.reject{border-color:#824a50}
.visit-list{display:grid;gap:11px}.visit-card{display:grid;grid-template-columns:180px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px}.route{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.route span{border:1px solid var(--line);border-radius:99px;padding:4px 9px}.role-note{border-right:3px solid var(--warn);padding:10px 14px;background:#2a241b;border-radius:8px}
@media(max-width:760px){.camera-layout{grid-template-columns:1fr}.camera-list{position:static;grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(2,1fr)}.visit-card{grid-template-columns:1fr}.studio-controls .row>*{width:100%}.act,.ghost{min-height:44px}}
@media(max-width:560px){header{gap:7px;flex-wrap:wrap}header h1{width:100%}.header-spacer{display:none}header .stat{font-size:10px;padding:5px 8px}.clock{margin-inline-start:auto}}
.dashboard{direction:rtl;text-align:right}
.dashboard td,.dashboard th{text-align:right}
.welcome-card{display:flex;align-items:center;justify-content:space-between;gap:18px;
  border:1px solid var(--line);border-radius:18px;padding:20px;background:linear-gradient(145deg,#2a2c2f,#191a1c)}
.welcome-card h3{font-size:20px;margin-bottom:4px}.welcome-card p{color:var(--dim);max-width:760px}
details{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0 20px}
details summary{cursor:pointer;font-weight:750;color:var(--fg);padding:5px}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;align-items:stretch;margin-bottom:20px}
.hero-main,.guide-card{border:1px solid var(--line);border-radius:20px;padding:24px;
  background:linear-gradient(145deg,#2a2c2f,#191a1c);box-shadow:0 18px 50px #00000066}
.eyebrow{color:var(--acc);font-weight:750;font-size:12px;letter-spacing:.08em;margin-bottom:8px}

.status-line{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 16px var(--good)}
.pill,.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--dim);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 28px}
.summary-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}

.summary-card .label{color:var(--dim)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 0 12px}
.section-head h2{margin:0;color:var(--fg);font:750 18px var(--sans);text-transform:none;letter-spacing:0}
.section-head p{color:var(--dim);margin-top:3px}
.people-dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.person-stat-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;transition:.2s ease;cursor:pointer}

.person-top{display:flex;gap:13px;align-items:center}
.avatar{width:66px;height:66px;border-radius:17px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}

.person-title{font-size:18px;font-weight:750}.person-sub{color:var(--dim);font-size:13px;margin-top:3px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.mini-stat{background:var(--panel2);border-radius:10px;padding:9px;text-align:center}
.mini-stat b{display:block;font-size:15px}.mini-stat span{font-size:11px;color:var(--dim)}
.recent-list{display:grid;gap:8px}.recent-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.recent-item .time{color:var(--dim);font-size:12px}.score-good{color:var(--good)}
.event-thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;display:block;
  border:1px solid var(--line);cursor:zoom-in;background:var(--panel2)}

.guide-list{display:grid;gap:12px;margin-top:15px}.guide-step{display:flex;gap:11px;align-items:flex-start}

.status-recognized{color:var(--good)}.status-review{color:var(--warn)}.status-no-face{color:var(--dim)}.status-processing{color:var(--accent2)}
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(130px,1fr)) auto;gap:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin:14px 0}
.event-dialog{border:1px solid var(--line);border-radius:22px;background:#17191b;color:var(--fg);
  width:min(1050px,95vw);max-height:92vh;padding:0;box-shadow:0 30px 90px #000c}

.event-dialog-content{padding:20px}.event-media{position:relative;display:grid;place-items:center;background:#0c0d0e;border-radius:14px;overflow:hidden}
.event-media img{width:100%;max-height:520px;object-fit:contain;background:#0c0d0e;border-radius:14px}
.play-clip{position:absolute;inset:auto 50% 18px auto;transform:translateX(50%);font-size:14px!important;padding:10px 18px!important;border-radius:99px!important;box-shadow:0 8px 30px #000b}
.video-overlay{border:0;position:fixed;inset:0;width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:14px;background:#08090aeb;color:var(--fg);align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.video-overlay[open]{display:flex}.video-overlay::backdrop{background:#08090aeb}.video-panel{position:relative;width:min(1000px,100%);background:#111315;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 30px 90px #000}

.reference-strip{display:flex;gap:8px;margin:10px 0}.reference-strip img{width:84px;height:84px;object-fit:cover;border-radius:12px}

.sync-card.done{opacity:.55}.progress-note{padding:12px;border-right:3px solid var(--acc);background:var(--panel);color:var(--dim)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.product-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,#24272a,#181a1c);padding:17px;box-shadow:0 12px 34px #0004}.product-card.ready{border-color:#50785a}.product-card.review{border-color:#78613e}.product-card.new{border-style:dashed}.product-card .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.state-chip{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800;background:var(--panel2);color:var(--dim)}.state-chip.ready{color:#aee6b8}.state-chip.review{color:#f2cb8c}.wizard{border:1px solid color-mix(in oklab,var(--acc) 55%,var(--line));border-radius:22px;background:linear-gradient(135deg,color-mix(in oklab,var(--panel) 88%,var(--acc) 12%),var(--panel));padding:22px;margin-bottom:22px}.wizard h2{font:800 24px var(--sans);color:var(--fg);text-transform:none;letter-spacing:0}.wizard-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.wizard-flow div{display:flex;gap:9px;align-items:center;color:var(--dim)}.wizard-flow b{width:28px;height:28px;border-radius:9px;background:var(--acc);color:#152018;display:grid;place-items:center}.intercom-preview{position:relative;border-radius:18px;overflow:hidden;background:#08090a;min-height:280px;display:grid;place-items:center}.intercom-preview img{width:100%;max-height:62vh;object-fit:contain}.intercom-guide{position:absolute;border:3px solid #74cbe8;border-radius:42% 42% 48% 48%;box-shadow:0 0 0 9999px #0004;pointer-events:none}.result-banner{padding:13px 16px;border-radius:14px;background:var(--panel2);border-right:4px solid var(--accent2);margin:12px 0}.result-banner.excellent{border-color:var(--good)}.result-banner.improve,.result-banner.acceptable{border-color:var(--warn)}.result-banner.no_face{border-color:var(--bad)}.danger{color:#ffd1d5!important;border-color:#824a50!important}.user-dialog-grid{display:grid;grid-template-columns:180px 1fr;gap:18px}.user-dialog-grid .avatar{width:180px;height:180px}.upload-report{display:grid;gap:7px;margin-top:12px}.upload-report div{padding:9px;border-radius:10px;background:var(--panel2)}
.liveness-visual{position:relative;margin:14px 0;border-radius:16px;overflow:hidden;background:#090a0b}.liveness-visual img{display:block;width:100%;height:auto}.face-outline{display:none;position:absolute;border:3px solid var(--warn);border-radius:12px;box-shadow:0 0 0 2px #0009,0 0 22px color-mix(in oklab,var(--warn) 65%,transparent);pointer-events:none}.face-outline.live{border-color:var(--good);box-shadow:0 0 0 2px #0009,0 0 22px color-mix(in oklab,var(--good) 65%,transparent)}.face-outline.spoof{border-color:var(--bad);box-shadow:0 0 0 2px #0009,0 0 22px color-mix(in oklab,var(--bad) 65%,transparent)}.face-outline span{position:absolute;right:-3px;bottom:calc(100% + 5px);white-space:nowrap;padding:5px 9px;border-radius:8px;background:#101214e8;border:1px solid currentColor;color:#fff;font:800 12px var(--mono)}.live-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.live-metric{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px}.live-metric b,.live-metric span{display:block}.live-metric b{font-size:15px}.live-metric span{color:var(--dim);font-size:10px;margin-top:2px}.guidance-list{display:grid;gap:6px;margin-top:9px}.guidance-list div{padding:8px 10px;border-radius:9px;background:#ffffff08}.guidance-list div::before{content:'←';color:var(--acc);margin-left:7px;font-weight:900}
@media(max-width:850px){.hero{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}nav{top:64px}}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.event-media{grid-template-columns:1fr}}
@media(max-width:700px){.evidence-grid{grid-template-columns:1fr}.sync-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.wizard-flow{grid-template-columns:1fr}.user-dialog-grid{grid-template-columns:1fr}.user-dialog-grid .avatar{width:100%;height:220px}.product-grid{grid-template-columns:1fr}}
@media(max-width:520px){.live-metrics{grid-template-columns:1fr 1fr}.face-outline span{font-size:10px}}
@media(max-width:520px){header{padding:12px 14px;align-items:flex-start}header h1{font-size:16px}header .stat{font-size:10px}nav{top:58px}.summary-grid{grid-template-columns:1fr 1fr}.people-dashboard{grid-template-columns:1fr}.hero-main,.guide-card{padding:18px}.welcome-card{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}}
@media(max-width:520px){
  .activity-scroll{overflow:visible!important}.activity-table,.activity-table tbody,.activity-table tr,.activity-table td{display:block;width:100%}
  .activity-table thead{display:none}.activity-table tr{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
  .activity-table td{border:0;padding:5px 2px}.activity-table td:not(.event-photo){display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:start}
  .activity-table td:not(.event-photo)::before{color:var(--dim);font-size:11px}
  .activity-table td:nth-child(2)::before{content:'זמן'}.activity-table td:nth-child(3)::before{content:'מצלמה'}
  .activity-table td:nth-child(4)::before{content:'החלטה'}.activity-table td:nth-child(5)::before{content:'אדם'}
  .activity-table td:nth-child(6)::before{content:'ביטחון'}.activity-table td:nth-child(7)::before{content:'קבוצה'}
  .activity-table td:nth-child(8)::before{content:'הקשר AI'}.activity-table td:nth-child(9)::before{content:'אימות שלך'}
  .activity-table .event-photo{max-width:none}.activity-table .event-thumb{width:100%;height:190px;margin-bottom:8px}
  .activity-table select{width:100%;min-width:0}
}

</head>
<body>
<header>
  <h1><span>Face</span>ID <small style="font-weight:500;color:var(--dim)">מרכז זיהוי חכם</small></h1>
  <span class="header-spacer"></span>
  <span class="stat clock" id="clock" aria-label="שעה מקומית">--:--:--</span>
  <span class="stat version-badge" id="versionBadge">v—</span>
  <span class="stat" id="health">—</span>
</header>
<div class="workspace-switch" aria-label="בחירת אזור עבודה">
  <button data-workspace="operate" class="on">פעולה שוטפת</button>
  <button data-workspace="investigate">תחקור אירועים</button>
  <button data-workspace="system">מערכת ובדיקות</button>
</div>
<nav>
  <button data-t="dashboard" data-workspace="operate" class="on" title="סיכום פשוט של המערכת">⌂ בית</button>
  <button data-t="unknowns" data-workspace="operate" title="פנים שממתינות לזיהוי">? אימות פנים</button>
  <button data-t="users" data-workspace="operate" title="הוספה וניהול פשוט של אנשים מוכרים">☺ משתמשים</button>
  <button data-t="intercom" data-workspace="operate" title="צילום איכותי וזיהוי בנקודת הכניסה">▣ אינטרקום</button>
  <button data-t="liveness" data-workspace="operate" title="הגנה מפני תמונה מודפסת או תמונה על מסך">◉ בדיקת חיוּת</button>
  <button data-t="visits" data-workspace="operate" title="ביקורים ומעברים בין מצלמות">↝ ביקורים</button>
  <button data-t="cameras" data-workspace="operate" title="כוונון חזותי לכל מצלמה">▣ מצלמות</button>
  <button data-t="automations" data-workspace="operate" title="בניית אוטומציות ל־Home Assistant">⌁ אוטומציות</button>
  <button data-t="activity" data-workspace="investigate" title="מי נראה, איפה ומתי">◷ חיפוש אירועים</button>
  <button data-t="calibration" data-workspace="investigate" title="בדיקת דיוק והמלצות בטוחות">◎ דיוק זיהוי</button>
  <button data-t="privacy" data-workspace="investigate" title="שמירת מידע ופרטיות">◈ שמירת ראיות</button>
  <button data-t="learning" data-workspace="system" title="שיפור הגלריה וסנכרון מבוקר עם Frigate">✦ שיפור תמונות</button>
  <button data-t="advanced" data-workspace="system" title="זיהוי גוף ובדיקת שלוש שכבות">◇ זיהוי גוף ו־AI</button>
  <button data-t="persons" data-workspace="system" title="ניהול טכני של תמונות ייחוס וכפילויות">▦ גלריה מתקדמת</button>
  <button data-t="health-center" data-workspace="system" title="בדיקת מצלמות וחיבורים">♡ תקינות המערכת</button>
  <button data-t="ignored" data-workspace="system" title="אנשים שהמערכת מתעלמת מהם">⊘ רשימת התעלמות</button>
  <button data-t="settings" data-workspace="system" title="הגדרות וגיבויים">⚙ הגדרות וגיבוי</button>
  <button data-t="log" data-workspace="system" title="מידע טכני לפתרון תקלות">≡ לוג טכני</button>
</nav>
<main id="main"></main>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg" src=""><span class="cap" id="lbcap"></span></div>
<dialog id="eventDialog" class="event-dialog"><div class="event-dialog-content" id="eventDialogContent"></div></dialog>
<dialog id="videoOverlay" class="video-overlay" onclick="if(event.target===this)closeEventVideo()"><div class="video-panel" onclick="event.stopPropagation()"><button class="ghost video-close" onclick="closeEventVideo()">✕ סגור</button><video id="eventVideo" controls playsinline preload="metadata"></video><div id="videoMessage" class="stat" style="display:none;padding:18px;text-align:center"></div></div></dialog>

<script>
const UI_VERSION='5.0.2';
const $=s=>document.querySelector(s), main=$('#main');
let tab='dashboard', persons={}, selected=new Set(), suggestThr=0.40,currentSession={role:'admin',tabs:['*'],enforced:false};
let workspace=localStorage.getItem('faceid-workspace')||'operate';

async function j(url,opt={}){
  const method=(opt.method||'GET').toUpperCase(),mutation=!['GET','HEAD'].includes(method);
  const button=mutation&&document.activeElement?.matches?.('button')?document.activeElement:null;
  const original=button?.innerHTML;
  if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.innerHTML='מבצע את הפעולה…'}
  try{
    const r=await fetch(url,opt);
    if(!r.ok){let message=await r.text();try{message=JSON.parse(message).detail||message}catch{};throw new Error(message)}
    const result=await r.json();
    if(mutation&&!opt.quiet)toast('הפעולה הושלמה בהצלחה');
    return result;
  }catch(error){toast(`הפעולה נכשלה: ${error.message||'שגיאה לא ידועה'}`,'error');throw error}
  finally{if(button){button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=original}}
}
function toast(m,type='success'){const t=$('#toast');t.textContent=m;t.className=type;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTs(ts){return new Date(ts*1000).toLocaleString(undefined,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
// Wann das Ereignis passierte, nicht wann wir es verarbeitet haben — beim Verlaufs-Scan
// liegen die Wochen auseinander.
function fmtWhen(u){return fmtTs(u.event_ts||u.ts)}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;selected.clear();
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  render()});
function setWorkspace(next,chooseFirst=true){
  workspace=next;localStorage.setItem('faceid-workspace',next);
  document.body.dataset.workspace=next;
  document.querySelectorAll('.workspace-switch button').forEach(b=>b.classList.toggle('on',b.dataset.workspace===next));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('workspace-hidden',b.dataset.workspace!==next));
  if(chooseFirst&&!document.querySelector(`nav button[data-t="${tab}"][data-workspace="${next}"]`)){
    const first=document.querySelector(`nav button[data-workspace="${next}"]`);if(first)setTab(first.dataset.t);
  }
}
document.querySelectorAll('.workspace-switch button').forEach(b=>b.onclick=()=>setWorkspace(b.dataset.workspace));
setWorkspace(workspace,false);

async function loadSession(){try{currentSession=await j('api/session');const allowed=currentSession.tabs||['*'];if(!allowed.includes('*'))document.querySelectorAll('nav button').forEach(b=>b.hidden=!allowed.includes(b.dataset.t));}catch{}}

async function health(){try{const h=await j('api/health');
  if(h.version&&h.version!==UI_VERSION){
    const reloadKey=`faceid-ui-reload-${h.version}`;
    if(!sessionStorage.getItem(reloadKey)){
      sessionStorage.setItem(reloadKey,'1');
      const fresh=new URL(location.href);fresh.searchParams.set('_faceid_ui',h.version);location.replace(fresh);return;
    }
    toast(`ממשק ${UI_VERSION} מחובר לשרת ${h.version}. סגרו ופתחו מחדש את חלון התוסף.`,'error');
  }
  if(typeof h.suggest_threshold==='number')suggestThr=h.suggest_threshold;
  $('#versionBadge').textContent=`v${h.version||'?'}`;
  $('#health').textContent=`● מחובר · ${h.persons} אנשים · ${h.queue} לבדיקה · ${h.open_events} פעילים`}catch(e){$('#health').textContent='● לא מחובר'}}
function updateClock(){
  const now=new Date();
  $('#clock').textContent=now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('#clock').title=now.toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}

function personOptions(sel){
  const es=Object.entries(persons).sort((a,b)=>a[1].name.localeCompare(b[1].name,undefined,{sensitivity:'base'}));
  const opt=([s,p])=>`<option value="${s}"${s===sel?' selected':''}>${esc(p.name)}</option>`;
  const favs=es.filter(([,p])=>p.favorite), rest=es.filter(([,p])=>!p.favorite);
  let out='';
  if(favs.length)out+=`<optgroup label="★ Favorites">${favs.map(opt).join('')}</optgroup>`;
  if(rest.length)out+=(favs.length?`<optgroup label="Others">${rest.map(opt).join('')}</optgroup>`:rest.map(opt).join(''));
  return out;
}

async function render(){
  const t=tab;
  persons=await j('api/persons');
  if(t!==tab)return;
  if(tab==='dashboard')return renderDashboard();
  if(tab==='users')return renderUsers();
  if(tab==='intercom')return renderIntercom();
  if(tab==='liveness')return renderLiveness();
  if(tab==='unknowns')return renderUnknowns();
  if(tab==='persons')return renderPersons();
  if(tab==='learning')return renderLearning();
  if(tab==='advanced')return renderAdvanced();
  if(tab==='ignored')return renderIgnored();
  if(tab==='activity')return renderActivity();
  if(tab==='visits')return renderVisits();
  if(tab==='cameras')return renderCameras();
  if(tab==='health-center')return renderHealthCenter();
  if(tab==='automations')return renderAutomations();
  if(tab==='privacy')return renderPrivacy();
  if(tab==='calibration')return renderCalibration();
  if(tab==='settings')return renderSettings();
  if(tab==='log')return renderLog();
  return renderDashboard();
}

function relativeTime(ts){
  if(!ts)return 'עדיין לא נראה';
  const sec=Math.max(0,Date.now()/1000-ts),min=Math.round(sec/60);
  if(min<1)return 'עכשיו';
  if(min<60)return `לפני ${min} דקות`;
  const hours=Math.round(min/60);
  if(hours<24)return `לפני ${hours} שעות`;
  return `לפני ${Math.round(hours/24)} ימים`;
}
function confidence(score){return score?`${Math.round(score*100)}%`:'—'}
function setTab(next){
  const target=document.querySelector(`nav button[data-t="${next}"]`);if(target?.dataset.workspace&&target.dataset.workspace!==workspace)setWorkspace(target.dataset.workspace,false);
  tab=next;selected.clear();
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===next));
  render();
}
async function renderDashboard(){
  const [data,h]=await Promise.all([j('api/dashboard'),j('api/health')]);
  if(tab!=='dashboard')return;
  const s=data.summary||{},known=data.people.filter(p=>p.last_seen);
  const people=data.people.map(p=>`<article class="person-stat-card" onclick="showPersonActivity(${JSON.stringify(p.name).replace(/"/g,'&quot;')})">
    <div class="person-top">
      ${p.photo?`<img class="avatar" src="${p.photo}" alt="${esc(p.name)}">`:`<div class="avatar avatar-fallback">☺</div>`}
      <div><div class="person-title">${esc(p.name)}</div>
        <div class="person-sub">${p.last_camera?`נראה לאחרונה ב־${esc(p.last_camera)} · ${relativeTime(p.last_seen)}`:'עדיין אין זיהוי חדש'}</div></div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><b>${p.today}</b><span>היום</span></div>
      <div class="mini-stat"><b>${p.visit_statistics?.visits||0}</b><span>ביקורים · 30 יום</span></div>
      <div class="mini-stat"><b>${confidence(p.avg_score)}</b><span>ביטחון ממוצע</span></div>
    </div>
    <div class="person-sub" style="margin-top:10px">הכי הרבה: ${esc(p.top_camera||'אין עדיין נתונים')} · ${p.reference_photos} תמונות ייחוס</div>
  </article>`).join('');
  const recent=data.recent.map(e=>`<div class="recent-item">
    <span class="badge score-good">${confidence(e.score)}</span>
    <div><b>${esc(e.person)}</b><div class="person-sub">${esc(e.camera)} · ${relativeTime(e.start_ts)}</div></div>
    <button class="ghost" onclick="event.stopPropagation();showPersonActivity(${JSON.stringify(e.person).replace(/"/g,'&quot;')})">פרטים</button>
  </div>`).join('');
  const warning=(s.no_face_24h||0)>(s.recognized_24h||0)*2&&s.no_face_24h>3;
  main.innerHTML=`<div class="dashboard">
    <section class="hero">
      <div class="hero-main">
        <div class="eyebrow">תמונת מצב עכשיו</div>
        <h1>${known.length?`${known.length} אנשים כבר זוהו במערכת`:'המערכת מוכנה לזיהוי הראשון'}</h1>
        <p>כאן רואים מי הופיע, באיזו מצלמה ועד כמה הזיהוי היה בטוח — בלי לפענח לוגים או ציונים טכניים.</p>
        <div class="status-line"><span class="status-dot"></span><b>המערכת פועלת</b>
          <span class="pill">${esc((h.engine.providers||['CPU'])[0])}</span>
          <span class="pill">AI ${h.ai.enabled?'פעיל':'כבוי'}</span></div>
        ${warning?`<div class="pill" style="margin-top:14px;color:var(--warn)">⚠ יש הרבה אירועים ללא פנים ברורות. כדאי לבדוק רזולוציית Snapshot ומיקום מצלמות.</div>`:''}
      </div>
      <aside class="guide-card">
        <div class="eyebrow">איך מתחילים?</div>
        <div class="guide-list">
          <div class="guide-step"><span class="step-num">1</span><div><b>עברו מול מצלמה</b><div class="person-sub">המתינו לסיום אירוע Frigate.</div></div></div>
          <div class="guide-step"><span class="step-num">2</span><div><b>בדקו פעילות</b><div class="person-sub">ראו את השם, המיקום והביטחון.</div></div></div>
          <div class="guide-step"><span class="step-num">3</span><div><b>אשרו מי באמת היה שם</b><div class="person-sub">כך המערכת תלמד אילו הגדרות מתאימות לבית שלכם.</div></div></div>
        </div>
        <button class="act" style="margin-top:18px" onclick="setTab('activity')">לפעילות האחרונה ←</button>
      </aside>
    </section>
    <section class="summary-grid">
      <div class="summary-card"><span class="label">זוהו בהצלחה היום</span><span class="value score-good">${s.recognized_24h||0}</span></div>
      <div class="summary-card"><span class="label">ממתינים לבדיקה</span><span class="value" style="color:var(--warn)">${s.needs_review_24h||0}</span></div>
      <div class="summary-card"><span class="label">ללא פנים ברורות</span><span class="value">${s.no_face_24h||0}</span></div>
      <div class="summary-card"><span class="label">אירועים פעילים עכשיו</span><span class="value" style="color:var(--accent2)">${s.processing||0}</span></div>
    </section>
    <div class="section-head"><div><h2>אנשים מוכרים</h2><p>לחיצה על אדם תציג את הפעילות שלו</p></div><button class="ghost" onclick="setTab('users')">ניהול משתמשים</button></div>
    <section class="people-dashboard">${people||'<div class="friendly-empty">עדיין אין אנשים בגלריה. הוסיפו אדם ותמונות כדי להתחיל.</div>'}</section>
    <div class="section-head"><div><h2>זיהויים אחרונים</h2><p>זיהויים שהשלימו את כל בדיקות הבטיחות</p></div></div>
    <section class="recent-list">${recent||'<div class="friendly-empty">עדיין אין זיהויים מאומתים חדשים.</div>'}</section>
  </div>`;
}
async function showPersonActivity(name){

async function runFrigateSync(direction){
  const selector=direction==='import'?'.sync-import:checked':'.sync-export:checked';
  const items=[...document.querySelectorAll(selector)].map(el=>direction==='import'?{person:el.dataset.person,file:el.dataset.file}:{slug:el.dataset.slug,file:el.dataset.file});
  if(!items.length){toast('יש לבחור לפחות תמונה אחת');return}
  const action=direction==='import'?'לייבא':'לשלוח';
  if(!confirm(`${action} ${items.length} תמונות מסומנות?`))return;
  toast('הסנכרון התחיל…');
  const result=await j(`api/frigate-sync/${direction}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
  const count=result.imported??result.exported??0;
  toast(`הושלמו ${count}; שגיאות ${result.errors?.length||0}`);persons=await j('api/persons');renderLearning();
}

  main.innerHTML=html+'</div>';

async function assignSuggestion(gi){
  const g=window._sugg[gi]; if(!g)return;
  const slug=$(`#ssel${gi}`).value||g.slug;
  const ids=g.items.map(it=>it.id).filter(id=>!window._excludedIds.has(id));
  if(!ids.length)return toast('Nothing to assign');
  const r=await j('api/unknowns/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,person:slug})});
  toast(`${r.assigned} face(s) assigned`);render();
}
async function ignoreSuggestion(gi){
  const g=window._sugg[gi]; if(!g)return;
  const ids=g.items.map(it=>it.id).filter(id=>!window._excludedIds.has(id));
  const r=await j('api/unknowns/ignore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,person:'-'})});
  toast(`${r.ignored} ignored`);render();
}
function hiliteSimilar(slug,items){
  const card=document.getElementById('p-'+slug); if(!card)return;
  const map=new Map((items||[]).map(x=>[x.file,x]));
  card.querySelectorAll('.grid:not(.trimgrid) .tile[data-file]').forEach(t=>{
    const it=map.get(t.dataset.file);
    t.classList.toggle('simhi',!!it&&it.partner);
    t.classList.toggle('simlow',!!it&&!it.partner);
    let b=t.querySelector('.simscore');
    if(it){
      if(!b){b=document.createElement('span');b.className='simscore';t.appendChild(b);}
      b.textContent=Math.round(it.score*100)+'%';
    }else if(b){b.remove();}
  });
}

function ignSelection(i){

async function applyIgnored(i){

  const lines=r.lines||[];
  const body=lines.map(l=>{
    const t=new Date(l.ts*1000).toLocaleTimeString();
    return `<div class="logline lv-${esc(l.level)}"><span class="t">${t}</span>  ${esc(l.logger)}  ${esc(l.msg)}</div>`;
  }).join('')||'<span class="stat">no log lines yet</span>';
  $('#main').innerHTML=`
    <div class="row" style="margin-bottom:8px;align-items:center">
      <b style="font:600 13px var(--sans)">SERVICE LOG</b>
      <span class="stat">${lines.length} line(s)${logLevel?' · '+logLevel.toLowerCase()+' and above':''}</span>
      <span style="flex:1"></span>
      <button class="act" onclick="setLogLevel(null)"${logLevel?'':' disabled'}>הצג את כל ההודעות</button>
      <button class="act" onclick="setLogLevel('WARNING')"${logLevel==='WARNING'?' disabled':''}>הצג אזהרות בלבד</button>
      <button class="act" onclick="copyLog()">העתק לוג ללוח</button>
    </div>
    <div class="logwrap" id="logwrap">${body}</div>
    <span class="stat">Refreshes every 5s while this tab is open. Handy when reporting an

function metric(v){return `${((+v||0)*100).toFixed(1)}%`}
function decisionInfo(status){
  return {
    recognized:['זוהה','p','המערכת זיהתה את האדם בביטחון'],
    ambiguous:['דרוש אישור','u','יש מועמד מתאים, אבל הביטחון עדיין לא מספיק'],
    unknown:['אדם לא מוכר','u','לא נמצאה התאמה מספקת לאנשים השמורים'],
    no_face:['לא נמצאו פנים','stat','לא נמצאו פנים ברורות בתמונה'],
    ignored:['הושתק','stat','הפנים תואמות לקבוצת ההתעלמות'],
    spoof_suspected:['נחסם — חשד לתמונה','u','המערכת זיהתה מאפיינים של תמונה או מסך ולכן לא בוצע זיהוי אדם'],
    liveness_unconfirmed:['נחסם — החיוּת לא אומתה','u','לא נאספו מספיק ראיות לחיוּת; זה אינו בהכרח ניסיון זיוף'],
    processing:['בעיבוד','u','האירוע עדיין אוסף תמונות לצורך החלטה']

}

async function saveThresholds(){
  const body={};
  ['match_threshold','unknown_threshold','match_margin','suggest_threshold','cluster_eps','ignore_threshold','ignore_margin'].forEach(k=>{
    const el=document.getElementById('set-'+k); if(el)body[k]=+el.value;});
  const mf=document.getElementById('set-maxfaces'); if(mf)body.max_faces_per_person=+mf.value;
  const topk=document.getElementById('set-topk'); if(topk)body.match_top_k=+topk.value;
  const conf=document.getElementById('set-confirmations'); if(conf)body.min_confirmations=+conf.value;
  const tk=document.getElementById('set-trimkeep'); if(tk)body.trimmed_keep=+tk.value;
  const dt=document.getElementById('set-dedupe_threshold'); if(dt)body.dedupe_threshold=+dt.value;
  const hr=document.getElementById('set-hires'); if(hr)body.hires_enroll=hr.checked;
  const r=await j('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  toast(r.trimmed?`Saved — ${r.trimmed} photo(s) trimmed`:'Settings saved');
  persons=await j('api/persons');
}
let _dedupeTimer=null;
function dedupePreview(){
  clearTimeout(_dedupeTimer);
  _dedupeTimer=setTimeout(async()=>{
    const el=document.getElementById('set-dedupe_threshold'); if(!el)return;
    const thr=+el.value;
    try{
      const r=await j('api/deduplicate',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({threshold:thr,dry_run:true})});
      const p=document.getElementById('dedupePrev');
      if(p){const parts=[];
        if(r.same_image)parts.push(`${r.same_image} duplicate image(s)`);
        if(r.similar_face)parts.push(`${r.similar_face} near-identical face(s) at sensitivity ${thr.toFixed(2)}`);
        p.textContent=parts.length?`would set aside: ${parts.join(' + ')} (restorable).`:`nothing to remove at sensitivity ${thr.toFixed(2)}.`;}
    }catch(e){}
  },250);
}
async function runDedupe(){
  const thr=+document.getElementById('set-dedupe_threshold').value;
  if(!confirm('Scan all persons and set aside near-duplicate photos (sensitivity '+thr.toFixed(2)+')? They stay restorable.'))return;

    const r=await j(`api/intercom/${encodeURIComponent(camera)}/capture`,{method:'POST'}),l=r.liveness||{},best=r.best,score=l.score==null?'—':Math.round(Number(l.score)*100)+'%';
    if(r.preview_url||best){$(`#liveImage-${id}`).src=`api/intercom/${encodeURIComponent(camera)}/capture/preview?_=${Date.now()}`}
    if(best&&r.width&&r.height){const b=best.box;outline.style.cssText=`display:block;left:${Math.max(0,b[0]/r.width*100)}%;top:${Math.max(0,b[1]/r.height*100)}%;width:${Math.max(1,(b[2]-b[0])/r.width*100)}%;height:${Math.max(1,(b[3]-b[1])/r.height*100)}%`;outline.className=`face-outline ${l.confirmed?'live':l.state==='spoof'?'spoof':''}`;$(`#liveBoxLabel-${id}`).textContent=`פנים ${Math.round(best.face_px)}px · נדרש ${r.profile.min_face_px}px`}
    metrics.innerHTML=best?[
      metricCard(`${Math.round(best.face_px)}px`,'גודל פנים',best.face_px>=r.profile.min_face_px?'תקין':'להתקרב'),
      metricCard(score,'חיוּת',l.confirmed?'עבר':l.state==='spoof'?'נחסם':'לא הושלם'),
      metricCard(`${Math.round(best.sharpness*100)}%`,'חדות',best.sharpness>=.45?'טובה':'להישאר יציב'),
      metricCard(`${Math.round(best.illumination*100)}%`,'תאורה',best.illumination>=.45?'טובה':'להוסיף אור')
    ].join(''):[metricCard('לא נמצאו','פנים'),metricCard('—','חיוּת'),metricCard('—','חדות'),metricCard('—','תאורה')].join('');
    box.className=`result-banner ${l.confirmed?'ok':l.state==='spoof'?'bad':'warn'}`;
    const title=l.confirmed?'✓ זוהה אדם חי':l.state==='spoof'?'⛔ חשד לתמונה או למסך':'לא התקבלה הוכחת חיוּת מספקת';
    const guidance=(r.guidance||[]).map(item=>`<div>${esc(item)}</div>`).join('');
    box.innerHTML=`<b>${title}</b><span>${esc(r.message)} · ${l.live_frames||0}/${l.required_frames||3} תמונות עברו.</span><div class="guidance-list">${guidance}</div><span class="stat">המסגרת מציגה את הפנים שנבדקו. ציון החיוּת אינו ציון התאמת הזהות.</span>`;
  }catch(e){box.className='result-banner bad';box.innerHTML=`<b>לא ניתן להשלים את הבדיקה</b><span>${esc(e.message)}</span>`}
  finally{if(button){button.disabled=false;button.textContent='◎ בדיקה חזותית עכשיו'}}
}

function personCard(slug,p){
  return `
    <div class="person" id="p-${slug}">
      <div class="head">
        <button class="fav${p.favorite?' on':''}" title="${p.favorite?'remove from favorites':'mark as favorite'}" onclick="toggleFav('${slug}',${p.favorite?0:1})">${p.favorite?'★':'☆'}</button>
        <b>${esc(p.name)}</b><span class="n">${p.count} תמונות ייחוס</span>
        <span style="flex:1"></span>
        <label class="ghost" style="cursor:pointer" title="הוספת תמונות מהטלפון או מהמחשב; הפנים ייחתכו אוטומטית">הוספת תמונות
          <input type="file" multiple accept="image/*" style="display:none" onchange="upload('${slug}',this)">
        </label>
        <button class="ghost" style="color:var(--warn);border-color:var(--warn)" title="הפסקת מעקב והתראות עבור אדם זה" onclick="ignorePerson('${slug}','${esc(p.name)}')">הפסקת מעקב</button>
        <button class="ghost" title="מחיקת האדם וכל תמונות הייחוס שלו" onclick="delPerson('${slug}','${esc(p.name)}')">מחיקה</button>
      </div>
      <div class="grid">${p.files.map(f=>`
        <div class="tile" data-file="${f}"><img src="media/persons/${slug}/${f}" loading="lazy" style="cursor:zoom-in"
            onclick="showFull('media/persons/${slug}/${f}','${esc(p.name)}')">
          <button class="u" title="הסר מהאדם והחזר לאימות פנים" onclick="unassignFace('${slug}','${f}')">הסר שיוך</button>
          <button class="x" title="מחק תמונה זו לצמיתות" onclick="delFace('${slug}','${f}')">מחק</button></div>`).join('')}
      </div>
      ${(p.trimmed&&p.trimmed.length)?`
      <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px">
        <span class="trimlabel">✂︎ תמונות שהועברו הצידה · ${p.trimmed.length}</span> <button class="ghost" style="font-size:10px;padding:1px 8px" title="מחיקת כל התמונות שהועברו הצידה עבור אדם זה" onclick="clearTrimmed('${slug}','${esc(p.name)}')">מחק את כל התמונות שבצד</button>
        <div class="stat">Set aside as duplicates or over the photo limit. <b>Hover a photo</b> to mark its closest matches above — <span style="color:var(--acc)">bright green</span> = the photo it duplicates, <span style="color:var(--dim)">grey outline + %</span> = merely its closest matches (same person, different angle — these are kept on purpose). ↩ restore or × delete. <a href="https://github.com/r11a/faceid/blob/main/docs/trimming.md" target="_blank" rel="noopener" style="color:var(--acc)">Learn more ↗</a></div>
        <div class="grid trimgrid" style="margin-top:6px">${p.trimmed.map(t=>`
          <div class="tile" onmouseenter="hiliteSimilar('${slug}',${JSON.stringify(t.similar||[]).replace(/"/g,'&quot;')})" onmouseleave="hiliteSimilar('${slug}',[])"><img src="media/persons/${slug}/_trimmed/${t.file}" loading="lazy" title="${t.kind==='same_image'?'Same image as the photo highlighted above.':t.kind==='near_dup'?'Near-duplicate of the photo highlighted above.':'Set aside because of the photo limit — highlighted above are its closest matches with their similarity. They are the same person from other angles, not duplicates.'} · ${fmtTs(t.ts)}">
            <button class="u" title="החזר תמונה זו לגלריה הפעילה" onclick="restoreTrimmed('${slug}','${t.file}')">החזר לגלריה</button>
            <button class="x" title="מחק תמונה זו לצמיתות" onclick="deleteTrimmed('${slug}','${t.file}')">מחק</button></div>`).join('')}
        </div>
      </div>`:''}
    </div>`;
}
async function renderPersons(){
  if(tab!=='persons')return;
  const entries=Object.entries(persons)
    .sort((a,b)=>a[1].name.localeCompare(b[1].name,undefined,{sensitivity:'base'}));
  const favs=entries.filter(([,p])=>p.favorite);
  const rest=entries.filter(([,p])=>!p.favorite);
  let body='';
  if(favs.length) body+=`<h2>★ מועדפים (${favs.length})</h2>`+favs.map(([s,p])=>personCard(s,p)).join('');
  if(rest.length) body+=`<h2>${favs.length?'אנשים נוספים':'אנשים מוכרים'} (${rest.length})</h2>`+rest.map(([s,p])=>personCard(s,p)).join('');
  if(!entries.length) body='<div class="friendly-empty">עדיין אין אנשים מוכרים. צרו אדם והוסיפו כמה תמונות מזוויות שונות.</div>';
  const jump=entries.length>3?`
      <select id="pjump" title="jump to a person" onchange="if(this.value){document.getElementById('p-'+this.value).scrollIntoView({behavior:'smooth',block:'start'});this.value='';}">
        <option value="">מעבר מהיר לאדם…</option>${personOptions('')}
      </select>`:'';
  main.innerHTML=`<div class="dashboard" dir="rtl">
    <div class="welcome-card"><div><span class="eyebrow">גלריית האנשים</span><h3>כאן מלמדים את המערכת את מי לזהות</h3>
      <p>לאיכות טובה מומלץ לשמור 5–10 תמונות ברורות לכל אדם, מזוויות ותאורה שונות. אין צורך בעשרות תמונות דומות.</p></div></div>
    <div class="row">
      <input id="pname" placeholder="שם האדם החדש…" size="18" title="יצירת אדם חדש ולאחר מכן הוספת תמונות">
      <button class="act" onclick="createPerson()">יצירת אדם</button>
      <span style="flex:1"></span>${jump}
    </div>${body}</div>`;
}
async function clearTrimmed(slug,name){
  if(!confirm('Delete all set-aside photos of "'+name+'"? Your active reference photos stay.'))return;
  const r=await j('api/persons/'+slug+'/trimmed/clear',{method:'POST'});
  toast(r.cleared+' set-aside photo(s) deleted');persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function restoreTrimmed(slug,file){
  await j(`api/persons/${slug}/trimmed/${file}/restore`,{method:'POST'});
  toast('Photo restored');persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function deleteTrimmed(slug,file){
  await j(`api/persons/${slug}/trimmed/${file}`,{method:'DELETE'});
  persons=await j('api/persons');if(tab==='persons')renderPersons();
}
async function toggleFav(slug,fav){
  await j(`api/persons/${slug}/favorite`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({favorite:!!fav})});
  persons=await j('api/persons');
  if(tab==='persons')renderPersons();
}
async function createPerson(){const n=$('#pname').value.trim();if(!n)return;
  await j('api/persons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  toast(`האדם "${n}" נוצר`);render()}
async function upload(slug,inp){
  const fd=new FormData();[...inp.files].forEach(f=>fd.append('files',f));
  toast(`מעבד ${inp.files.length} תמונות…`);
  const r=await j(`api/persons/${slug}/photos`,{method:'POST',body:fd});
  toast(`${r.added} תמונות נוספו${r.skipped.length?`, ${r.skipped.length} לא התאימו`:''}`);render()}
async function delFace(slug,f){await j(`api/persons/${slug}/faces/${f}`,{method:'DELETE'});render()}
async function unassignFace(slug,f){await j(`api/persons/${slug}/faces/${f}/unassign`,{method:'POST'});
  toast('התמונה הוסרה מהאדם והוחזרה לאימות פנים');render()}
async function ignorePerson(slug,name){
  if(!confirm(`Stop tracking "${name}"? All their faces become ignore anchors — they will never be notified, matched or shown again. (Reversible via the Ignored section.)`))return;
  const r=await j(`api/persons/${slug}/ignore`,{method:'POST'});
  toast(`"${name}" ignored (${r.ignored_faces} anchor faces)`);render();
}
async function delPerson(slug,name){if(!confirm(`Delete "${name}" and all their faces?`))return;
  await j(`api/persons/${slug}`,{method:'DELETE'});render()}


updateClock();setInterval(updateClock,1000);loadSession();health();setInterval(health,10000);render();
</script>
